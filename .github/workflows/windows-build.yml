name: Windows standalone application
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
      - name: Install build-time dependencies
        run: python -m pip install --upgrade pip setuptools wheel pyinstaller pyinstaller-hooks-contrib .
      - name: Build bundled nusamai CLI (no official Windows binary)
        shell: cmd
        run: call build_nusamai.bat
      - name: Windows tests using legacy Windows code page
        env:
          PYTHONUTF8: '0'
        run: python -m unittest discover -s tests -v
      - name: Build self-contained application
        run: python -m PyInstaller --noconfirm --clean packaging/plateau_bridge.spec
      - name: Verify bundled Python, geodesy data and Blender scripts
        shell: pwsh
        run: |
          $exe = 'dist/PLATEAU-Blender-Bridge/PLATEAU-Blender-Bridge.exe'
          $check = Start-Process $exe -ArgumentList '--self-check', 'frozen-check.json' -Wait -PassThru
          if ($check.ExitCode -ne 0) {
            if (Test-Path 'frozen-check.json') { Get-Content 'frozen-check.json' -Raw -Encoding utf8 }
            throw "Bundled exe self check failed (exit $($check.ExitCode))"
          }
          $report = Get-Content 'frozen-check.json' -Raw -Encoding utf8 | ConvertFrom-Json
          if (-not $report.passed) {
            $report | ConvertTo-Json -Depth 5
            throw 'Bundle requirements missing'
          }
      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Package portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/PLATEAU-Blender-Bridge' -DestinationPath 'PLATEAU-Blender-Bridge-v${{ steps.version.outputs.value }}-win-x64.zip' -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: PLATEAU-Blender-Bridge-v${{ steps.version.outputs.value }}-win-x64
          path: PLATEAU-Blender-Bridge-v${{ steps.version.outputs.value }}-win-x64.zip
          if-no-files-found: error
