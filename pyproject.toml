[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plateau-blend-mvp"
version = "0.11.0"
description = "Project PLATEAU auto CityGML + GSI terrain + aerial imagery to Blender"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0,<13", "pyproj>=3.6,<4"]

[project.scripts]
plateau-blend = "plateau_blend.cli:main"
plateau-blend-gui = "plateau_blend.gui:main"
plateau-citygml = "plateau_blend.converter:main"
plateau-blend-auto = "plateau_blend.auto_cli:main"
plateau-blend-auto-gui = "plateau_blend.auto_gui:main"

[tool.setuptools.packages.find]
include = ["plateau_blend*"]
